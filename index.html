<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
/* ================= Tema (tokens del diseño elegido) ================= */
:root{
  --background:oklch(0.9892 0.0054 117.9205);--foreground:oklch(0.2077 0.0398 265.7549);
  --card:oklch(1 0 0);--card-foreground:oklch(0.2077 0.0398 265.7549);
  --popover:oklch(1 0 0);--popover-foreground:oklch(0.2077 0.0398 265.7549);
  --primary:oklch(0.8871 0.2122 128.5041);--primary-foreground:oklch(0 0 0);
  --secondary:oklch(0.3717 0.0392 257.2870);--secondary-foreground:oklch(0.9842 0.0034 247.8575);
  --muted:oklch(0.9683 0.0069 247.8956);--muted-foreground:oklch(0.5544 0.0407 257.4166);
  --accent:oklch(0.9819 0.0181 155.8263);--accent-foreground:oklch(0.4479 0.1083 151.3277);
  --destructive:oklch(0.6368 0.2078 25.3313);--destructive-foreground:oklch(1 0 0);
  --border:oklch(0.9288 0.0126 255.5078);--input:oklch(0.9288 0.0126 255.5078);--ring:oklch(0.8871 0.2122 128.5041);
  --chart-1:oklch(0.8871 0.2122 128.5041);--chart-2:oklch(0.3717 0.0392 257.2870);--chart-3:oklch(0.7227 0.1920 149.5793);
  --chart-4:oklch(0.5544 0.0407 257.4166);--chart-5:oklch(0.7107 0.0351 256.7878);
  --sidebar:oklch(1 0 0);--sidebar-foreground:oklch(0.2077 0.0398 265.7549);
  --sidebar-primary:oklch(0.8871 0.2122 128.5041);--sidebar-primary-foreground:oklch(0 0 0);
  --sidebar-accent:oklch(0.9842 0.0034 247.8575);--sidebar-accent-foreground:oklch(0.2077 0.0398 265.7549);
  --sidebar-border:oklch(0.9683 0.0069 247.8956);--sidebar-ring:oklch(0.8871 0.2122 128.5041);
  --font-sans:Inter,system-ui,sans-serif;--font-serif:Georgia,serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;
  --radius:1rem;--radius-sm:calc(var(--radius) - 4px);--radius-md:calc(var(--radius) - 2px);--radius-lg:var(--radius);--radius-xl:calc(var(--radius) + 4px);
  --shadow-sm:0px 8px 20px 0px hsl(0 0% 0% / 0.05),0px 1px 2px -1px hsl(0 0% 0% / 0.05);
  --shadow:0px 8px 20px 0px hsl(0 0% 0% / 0.05),0px 1px 2px -1px hsl(0 0% 0% / 0.05);
  --shadow-lg:0px 8px 20px 0px hsl(0 0% 0% / 0.05),0px 4px 6px -1px hsl(0 0% 0% / 0.05);
  --shadow-2xl:0px 8px 20px 0px hsl(0 0% 0% / 0.13);
  --tracking-normal:-0.01em;
  /* Estados (derivados del tema) */
  --ok:var(--accent-foreground);--okbg:var(--accent);--okline:oklch(0.9 0.08 152);
  --warn:oklch(0.5 0.12 70);--warnbg:oklch(0.985 0.03 95);--warnline:oklch(0.92 0.1 92);
  --bad:oklch(0.55 0.21 27);--badbg:oklch(0.97 0.013 17);--badline:oklch(0.9 0.05 18);
  --info:oklch(0.49 0.2 264);--infobg:oklch(0.97 0.014 255);
  --chart-bad:oklch(0.81 0.1 20);--hover:var(--muted)}
.dark{
  --background:oklch(0.1288 0.0406 264.6952);--foreground:oklch(0.9842 0.0034 247.8575);
  --card:oklch(0.2077 0.0398 265.7549);--card-foreground:oklch(0.9842 0.0034 247.8575);
  --popover:oklch(0.2077 0.0398 265.7549);--popover-foreground:oklch(0.9842 0.0034 247.8575);
  --primary:oklch(0.8871 0.2122 128.5041);--primary-foreground:oklch(0 0 0);
  --secondary:oklch(0.2795 0.0368 260.0310);--secondary-foreground:oklch(0.9842 0.0034 247.8575);
  --muted:oklch(0.2795 0.0368 260.0310);--muted-foreground:oklch(0.7107 0.0351 256.7878);
  --accent:oklch(0.3925 0.0896 152.5353);--accent-foreground:oklch(0.8871 0.2122 128.5041);
  --destructive:oklch(0.4437 0.1613 26.8994);--destructive-foreground:oklch(1 0 0);
  --border:oklch(0.2795 0.0368 260.0310);--input:oklch(0.2795 0.0368 260.0310);--ring:oklch(0.8871 0.2122 128.5041);
  --chart-1:oklch(0.8871 0.2122 128.5041);--chart-2:oklch(0.6231 0.1880 259.8145);--chart-3:oklch(0.7227 0.1920 149.5793);
  --chart-4:oklch(0.6268 0.2325 303.9004);--chart-5:oklch(0.7686 0.1647 70.0804);
  --sidebar:oklch(0.1288 0.0406 264.6952);--sidebar-foreground:oklch(0.9842 0.0034 247.8575);
  --sidebar-primary:oklch(0.8871 0.2122 128.5041);--sidebar-primary-foreground:oklch(0 0 0);
  --sidebar-accent:oklch(0.2795 0.0368 260.0310);--sidebar-accent-foreground:oklch(0.9842 0.0034 247.8575);
  --sidebar-border:oklch(0.2795 0.0368 260.0310);--sidebar-ring:oklch(0.8871 0.2122 128.5041);
  --shadow-sm:0px 10px 25px 0px hsl(0 0% 0% / 0.40),0px 1px 2px -1px hsl(0 0% 0% / 0.40);
  --shadow:0px 10px 25px 0px hsl(0 0% 0% / 0.40),0px 1px 2px -1px hsl(0 0% 0% / 0.40);
  --shadow-lg:0px 10px 25px 0px hsl(0 0% 0% / 0.40),0px 4px 6px -1px hsl(0 0% 0% / 0.40);
  --shadow-2xl:0px 10px 25px 0px hsl(0 0% 0% / 1);
  --ok:oklch(0.87 0.14 150);--okbg:oklch(0.3925 0.0896 152.5353 / .35);--okline:oklch(0.3925 0.0896 152.5353);
  --warn:oklch(0.86 0.15 85);--warnbg:oklch(0.5 0.12 70 / .18);--warnline:oklch(0.5 0.12 70 / .5);
  --bad:oklch(0.8 0.1 20);--badbg:oklch(0.4437 0.1613 26.8994 / .25);--badline:oklch(0.4437 0.1613 26.8994 / .7);
  --info:oklch(0.8 0.1 255);--infobg:oklch(0.6231 0.188 259.8 / .18);
  --chart-bad:oklch(0.64 0.19 22);--hover:var(--muted)}

/* ================= Base ================= */
*{box-sizing:border-box;border-color:var(--border)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14.5px/1.5 var(--font-sans);letter-spacing:var(--tracking-normal);background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid color-mix(in srgb,var(--ring) 50%,transparent);outline-offset:2px}
a{color:var(--accent-foreground)}
h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.02em}
h3{margin:0 0 12px;font-size:15.5px;font-weight:600}
.lead{color:var(--muted-foreground);margin:0 0 18px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);font-weight:600}
.sub{font-size:13px;color:var(--muted-foreground)}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:0}
.grow{flex:1;min-width:0}

/* ================= Estructura: menú lateral + contenido ================= */
#app{display:flex;min-height:100vh}
#side{width:248px;flex:none;background:var(--sidebar);color:var(--sidebar-foreground);border-right:1px solid var(--sidebar-border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;z-index:1300}
#brand{display:flex;gap:11px;align-items:center;padding:0 8px 26px}
#brand img{height:36px;max-width:150px;object-fit:contain}
.logo{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(var(--primary) 0 72%,var(--chart-3) 72% 100%);position:relative}
.logo::after{content:"";position:absolute;inset:9px;background:var(--sidebar);border-radius:50%}
#brand b{display:block;font-size:16px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
#brand small{display:block;font-size:11.5px;color:var(--muted-foreground)}
#nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.navlbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-foreground);padding:18px 14px 6px;font-weight:600}
.tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-radius:var(--radius-md);font-weight:500;color:var(--sidebar-foreground);cursor:pointer;transition:background .15s}
.tab svg{width:18px;height:18px;flex:none;color:var(--muted-foreground)}
.tab:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.tab.on{background:var(--sidebar-primary);color:var(--sidebar-primary-foreground);font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,var(--sidebar-primary) 35%,transparent)}
.tab.on svg{color:var(--sidebar-primary-foreground)}
.tab .badge{margin-left:auto}
.sfoot{border-top:1px solid var(--sidebar-border);padding:14px 8px 0;font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
.sfoot i{width:8px;height:8px;border-radius:50%;background:var(--chart-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--chart-3) 25%,transparent);flex:none}
.wrapc{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:1100;display:flex;align-items:center;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--background) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.02em}
.ham,.iconbtn{border:1px solid var(--border);background:var(--card);width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;cursor:pointer;color:var(--foreground);flex:none}
.ham{display:none;border:0;background:none;margin-left:-6px}
.ham svg,.iconbtn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;white-space:nowrap;color:var(--muted-foreground)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--chart-5);flex:none}
.pill.ok i{background:var(--chart-3)}.pill.warn i{background:oklch(0.77 0.16 70)}.pill.bad i{background:var(--destructive)}
.pill.live i{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--chart-3) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
select.pill{appearance:auto}
#who{max-width:260px}
#scrim{display:none}
main{width:100%;max-width:1320px;padding:26px 28px 80px}
#main>h2:first-child:not(.keep){display:none}
@media(max-width:980px){
  #side{position:fixed;left:0;top:0;bottom:0;height:auto;transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--shadow-2xl)}
  body.menu-open #side{transform:none}
  body.menu-open #scrim{display:block;position:fixed;inset:0;background:oklch(0.13 0.04 265 / .45);z-index:1250}
  .ham{display:grid}.top{padding:10px 14px;gap:8px}.top h1{font-size:17px}#who{max-width:180px}main{padding:16px 16px 80px}}
@media(max-width:560px){#who{order:5;max-width:none;width:100%}.top .grow{display:none}#gps{margin-left:auto}}

/* ================= Tarjetas y paneles ================= */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card.clickable{display:block;width:100%;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.card.clickable:hover{border-color:var(--primary);transform:translateY(-1px)}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.grid2>.card,.grid3>.card{margin:0}
.topgrid{display:grid;gap:16px;grid-template-columns:minmax(300px,1.15fr) 1fr 1fr;margin-bottom:16px}
.topgrid .hero{grid-row:span 2}
@media(max-width:1180px){.topgrid{grid-template-columns:1fr 1fr}.topgrid .hero{grid-column:1/-1;grid-row:auto}}
@media(max-width:560px){.topgrid{gap:10px}}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(170px,46%),1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.kic{width:42px;height:42px;border-radius:var(--radius-sm);display:grid;place-items:center;margin-bottom:14px}
.kic svg{width:20px;height:20px}
.kic.g{background:var(--accent);color:var(--accent-foreground)}
.kic.r{background:var(--badbg);color:var(--bad)}
.kic.a{background:var(--warnbg);color:var(--warn)}
.kic.b{background:var(--infobg);color:var(--info)}
.kpi>span{display:block;font-size:13px;color:var(--muted-foreground)}
.kpi>b{display:block;font-size:28px;line-height:1.2;margin-top:4px;font-weight:700;letter-spacing:-.03em}
.kpi small{color:var(--muted-foreground);font-size:12px}
.ksub{border-top:1px solid var(--border);margin-top:auto;padding-top:10px;font-size:13px;color:var(--muted-foreground)}
.ksub b{color:var(--foreground)}
.kpi>b+.ksub{margin-top:12px}
@media(max-width:560px){.kpi{padding:14px}.kpi>b{font-size:22px}.kic{width:36px;height:36px;margin-bottom:10px}.ksub{font-size:12px}}
/* Tarjeta destacada oscura con indicador */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--primary) 20%,oklch(0.2077 0.0398 265.75)) 0%,oklch(0.2077 0.0398 265.75) 55%,oklch(0.1288 0.0406 264.7) 100%);color:oklch(0.9842 0.0034 247.86);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow-2xl);min-height:330px}
.hero .htitle{align-self:flex-start;font-weight:600;font-size:15.5px}
.gwrap{position:relative;width:min(310px,100%);margin:12px auto 0}
.gwrap svg{display:block;width:100%;height:auto;overflow:visible}
.gtxt{position:absolute;left:0;right:0;bottom:0;text-align:center;pointer-events:none}
.hchip{position:relative;z-index:1;display:inline-block;background:var(--primary);color:var(--primary-foreground);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700}
.hbig{font-size:50px;font-weight:700;line-height:1.05;letter-spacing:-.04em}
.hsub{font-size:13px;color:oklch(0.7107 0.0351 256.79);margin-top:12px;text-align:center}.hsub b{color:#fff}
.hpill{display:inline-flex;align-items:center;gap:7px;background:var(--primary);color:var(--primary-foreground);border-radius:99px;padding:7px 16px;font-weight:600;font-size:13px;margin-top:12px}
.hpill svg{width:15px;height:15px}
.hpill.warn{background:oklch(0.77 0.16 70);color:oklch(0.2 0.04 265)}
.hgap{flex:1;min-height:16px}
.hfoot{align-self:stretch;display:flex;justify-content:space-between;gap:10px;border-top:1px solid oklch(1 0 0 / .12);padding-top:14px;font-size:12.5px;color:oklch(0.7107 0.0351 256.79);flex-wrap:wrap}
.hfoot b{color:#fff}
/* Paneles con gráfico + resumen */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:16px}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--border)}
.ptag{display:inline-block;background:var(--accent);color:var(--accent-foreground);border:1px solid var(--okline);border-radius:99px;padding:5px 15px;font-weight:600;font-size:13px}
.panel-b{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(250px,1fr);gap:24px;padding:18px 20px 20px}
@media(max-width:1000px){.panel-b{grid-template-columns:1fr}}
.chart-t{font-size:15px;font-weight:600;margin:0 0 6px}
.clegend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12px;color:var(--muted-foreground);margin:4px 0 2px}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend i{width:10px;height:10px;border-radius:50%;display:inline-block}
svg.combo{display:block;width:100%;height:auto;overflow:visible}
.combo .ax{font-size:11px;fill:var(--muted-foreground);font-family:var(--font-sans)}
.combo .xl{font-size:11px;fill:var(--muted-foreground);font-family:var(--font-sans)}
.combo .gl{stroke:var(--border)}
.combo .pl{font-size:10.5px;fill:#fff;font-weight:700;font-family:var(--font-sans)}
.sbox{border:1px solid;border-radius:var(--radius-sm);padding:11px 14px 12px;margin-bottom:10px}
.sbox .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500;margin-bottom:8px}
.sbox .t .mono{font-size:11.5px;white-space:nowrap}
.sbar{height:6px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px}
.sbox.g{background:var(--okbg);border-color:var(--okline);color:var(--ok)}.sbox.g .sbar i{background:var(--chart-3)}
.sbox.y{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}.sbox.y .sbar i{background:oklch(0.85 0.17 90)}
.sbox.r{background:var(--badbg);border-color:var(--badline);color:var(--bad)}.sbox.r .sbar i{background:var(--chart-bad)}

/* ================= Componentes ================= */
.bar{height:8px;background:var(--muted);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--muted);color:var(--muted-foreground);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--infobg);color:var(--info)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tier{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:7px;font-size:11px;font-weight:700;color:#fff;vertical-align:middle}
.tA{background:var(--secondary);color:var(--secondary-foreground)}.tB{background:var(--chart-4);color:#fff}.tC{background:var(--chart-5);color:#fff}
.dark .tA{background:var(--primary);color:var(--primary-foreground)}
.tbad{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--input);background:var(--card);padding:9px 16px;border-radius:var(--radius-md);font-weight:600;cursor:pointer;text-decoration:none;color:var(--foreground);white-space:nowrap;transition:background .15s,border-color .15s;box-shadow:0 1px 2px hsl(0 0% 0% / .04)}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{filter:brightness(.96);background:var(--primary)}
.btn.ghost{border-style:dashed;color:var(--muted-foreground)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:var(--radius-sm)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.link{border:0;background:none;color:var(--accent-foreground);font-weight:600;cursor:pointer;padding:0 4px}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}

<script>
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);

const fmtDT=ts=>new Date(ts).toLocaleString('es-PY',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

function distribute(items,ids,lastPos){
  if(!items.length||!ids.length)return;

   Hay dos versiones de este archivo (ejecutivo.html y admin.html); cada una acepta solo sus propias cuentas.
   Las contraseñas no están escritas: se guarda solo su huella (SHA-256).
   OJO: en un archivo HTML esto es una puerta de entrada, no seguridad real.
   Para seguridad real, el ingreso debe validarlo un servidor (por ejemplo, Supabase Auth). */
const APP_MODE=document.documentElement.dataset.mode==='ejecutivo'?'ejecutivo':'admin';

function sha256(str){

      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+K[i]+(W[i]=i<16?W[i]:(W[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+W[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);

  return res}

function howHTML(){const R=S.settings;return `<details class="card how"><summary>¿Cómo se verifica cada visita?</summary><ul>

/* ============ Cámara en vivo ============
   La foto se saca dentro de la app con la cámara (no hay botón para elegir archivos).
   Así no se pueden usar fotos de la galería ni imágenes guardadas en la computadora. */
const CAM={stream:null,facing:'environment'};
const camIdleHTML=()=>`<button class="camstart" data-act="cam-open">${ICON.camera}<span>Abrir cámara</span></button>`;
function stopCam(){try{CAM.stream?.getTracks().forEach(t=>t.stop())}catch(e){}CAM.stream=null}
async function camOpen(){
  const box=$('#vm-cam');if(!box)return;
  if(!navigator.mediaDevices?.getUserMedia)return toast('Este navegador no permite usar la cámara. Usá Chrome o Safari actualizados.');
  stopCam();box.innerHTML='<div class="camwait">Abriendo cámara…</div>';
  try{CAM.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:CAM.facing},width:{ideal:1280},height:{ideal:960}}})}
  catch(e){box.innerHTML=camIdleHTML();return toast(e.name==='NotAllowedError'?'Permiso de cámara denegado. Activalo en la configuración del navegador.':e.name==='NotFoundError'?'No se encontró ninguna cámara en este dispositivo.':'No se pudo abrir la cámara: '+e.message)}
  if(!VM){stopCam();return}
  box.innerHTML=`<video id="vm-video" autoplay playsinline muted></video><div class="camctl"><button class="btn sm" data-act="cam-cancel">Cancelar</button><button class="shutter" data-act="cam-shoot" aria-label="Sacar foto"></button><button class="btn sm" data-act="cam-flip" aria-label="Cambiar de cámara">↺ Girar</button></div>`;
  const v=$('#vm-video');v.srcObject=CAM.stream;try{await v.play()}catch(e){}}
function camShoot(){
  const v=$('#vm-video');if(!v||!v.videoWidth)return toast('La cámara todavía no está lista');
  const k=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
  const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height).data;let sum=0,n=0;for(let i=0;i<d.length;i+=400){sum+=d[i]*.299+d[i+1]*.587+d[i+2]*.114;n++}
  if(sum/n<18)return toast('La foto salió negra. Revisá que la cámara no esté tapada.');
  VM.photo=c.toDataURL('image/jpeg',.7);VM.photoAge=0;VM.photoTs=Date.now();stopCam();
  $('#vm-cam').innerHTML=`<img src="${VM.photo}" alt="Foto del comercio"><div class="camok"><span class="badge ok">✓ Foto sacada a las ${fmtT(VM.photoTs)}</span><button class="btn sm" data-act="cam-open">Repetir foto</button></div>`}
function isMobile(){
  const ua=navigator.userAgent||'';if(navigator.userAgentData?.mobile===true)return true;
  return /Android|iPhone|iPod|iPad|Mobile/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)}
function mountVMMap(){
  const el=$('#vm-map');if(!M){el.innerHTML='<p class="pad">Mapa no disponible sin internet. El GPS funciona igual.</p>';return}
  const t=VM.target;VMAP=M.map(el,{zoomControl:false,attributionControl:false}).setView([t.lat,t.lng],17);tiles(VMAP);
  M.circle([t.lat,t.lng],{radius:S.settings.radius,color:mapC(),weight:2,fillOpacity:.08}).addTo(VMAP);
  M.marker([t.lat,t.lng],{icon:divI(`<div class="pin" style="background:${mapC()}"></div>`,22)}).addTo(VMAP).bindTooltip(t.name);
  VM.layer=M.layerGroup().addTo(VMAP);setTimeout(()=>VMAP&&VMAP.invalidateSize(),150)}
async function vmLocate(){
  const box=$('#vm-gps');if(!box||!VM)return;box.className='gpsbox wait';box.textContent='📡 Obteniendo tu ubicación…';
  try{const p=await gpsGet();if(!VM)return;VM.pos=p;vmShow()}
  catch(e){if(!VM)return;box.className='gpsbox bad';box.innerHTML=`<div class="gbig">Sin ubicación</div>${esc(e.message)}<div class="sub" style="margin-top:6px">Salí al exterior, revisá que el GPS del celular esté encendido y tocá “Actualizar ubicación”.</div>`;vmSaveState()}}
function vmShow(){
  const p=VM.pos,t=VM.target,R=S.settings,d=hav(p.lat,p.lng,t.lat,t.lng);VM.dist=d;const inside=d<=R.radius,accOk=p.acc<=R.maxAcc;
  const box=$('#vm-gps');box.className='gpsbox '+(inside&&accOk?'ok':inside?'warn':'bad');
  box.innerHTML=`<div class="gbig">${inside?(accOk?'✓ Estás en el comercio':'⚠ Estás en el comercio, pero la señal es débil'):'✕ Estás lejos del comercio'}</div>
  <div class="ggrid"><div><span>Distancia</span><b>${fmtM(d)}</b></div><div><span>Radio</span><b>${R.radius} m</b></div><div><span>Precisión</span><b class="${accOk?'':'tbad'}">±${p.acc} m</b></div><div><span>Hora GPS</span><b>${fmtT(p.ts)}</b></div></div>
  <div class="sub mono">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}${p.sim?' · simulado':''}</div>

function reqAlerts(r){

  if(r.to.acc>R.maxAcc)out.push(`Precisión GPS baja (±${r.to.acc} m)`);if(r.sim)out.push('GPS simulado');
  const same=S.locRequests.filter(x=>x.id!==r.id&&x.asesorId===r.asesorId&&x.clientId!==r.clientId&&hav(x.to.lat,x.to.lng,r.to.lat,r.to.lng)<R.radius);
  if(same.length)out.push(`El mismo asesor propuso este lugar para ${same.length} cliente${same.length>1?'s':''} más`);
  const near=S.clients.find(x=>x.id!==c.id&&hav(x.lat,x.lng,r.to.lat,r.to.lng)<40);if(near)out.push(`Coincide con la ubicación de ${near.name}`);

/* ============ 2. Validación del servidor ============
   En producción, esta parte corre en el SERVIDOR, no en el celular:
   el celular solo manda datos crudos (posición, foto, respuestas) y el servidor
   pone la hora, recalcula la distancia contra la ubicación fija del cliente,
   compara la foto con las anteriores, la sella y firma la visita.
   En este prototipo se ejecuta en el navegador para poder probarlo; la clave
   del sello debe vivir solo en el servidor real. */
const SECRET='clave-del-servidor-demo';
const SERVER={
  now:()=>Date.now(),
  target(p){
    if(p.branchId){const b=S.branches.find(x=>x.id===p.branchId);if(b)return{name:bName(b),lat:b.lat,lng:b.lng}}
    if(p.clientId){const c=S.clients.find(x=>x.id===p.clientId);if(c)return{name:c.name,lat:c.lat,lng:c.lng}}
    const it=S.campaigns.find(k=>k.id===p.campaignId)?.items.find(i=>i.id===p.itemId);return it?{name:it.name,lat:it.lat,lng:it.lng}:null},
  async receiveVisit(p){
    const R=S.settings,now=SERVER.now(),t=SERVER.target(p);if(!t)throw new Error('El comercio no existe en el servidor');
    const skewMs=p.deviceTs-now,skew=Math.round(skewMs/60000),pos=p.pos;
    const d=Math.round(hav(pos.lat,pos.lng,t.lat,t.lng));
    if(R.blockOutside&&d>R.radius)throw new Error(`Rechazada por el servidor: estás a ${fmtM(d)} del comercio`);
    const flags=[];
    if(d>R.radius)flags.push('fuera_radio');if(pos.acc>R.maxAcc)flags.push('precision_baja');if(pos.sim)flags.push('gps_simulado');
    if(Math.abs(skew)>R.maxSkew)flags.push('hora_alterada');
    if(R.mobileOnly&&!p.mobile)flags.push('no_movil');
    if(now-(pos.ts-skewMs)>180000)flags.push('gps_viejo');
    let photoHash=null,dupOf=null;
    if(p.photo){photoHash=await dHash(p.photo);const same=S.visits.find(v=>v.photoHash&&hamming(v.photoHash,photoHash)<=R.dupDist);
      if(same){flags.push('foto_repetida');dupOf=same.id}if(p.photoAge>R.photoMaxAge)flags.push('foto_antigua')}
    else flags.push('sin_foto');
    const prev=S.visits.filter(v=>v.asesorId===p.asesorId).sort((a,b)=>b.ts-a.ts)[0];
    if(prev){const h=(now-prev.ts)/3600e3,km=hav(prev.lat,prev.lng,pos.lat,pos.lng)/1000;if(km>2&&h>0&&km/h>120)flags.push('salto_imposible')}
    const v={id:uid(),clientId:p.clientId||null,branchId:p.branchId||null,target:t,asesorId:p.asesorId,ts:now,serverTs:now,deviceTs:p.deviceTs,skewMin:skew,
      lat:+pos.lat.toFixed(6),lng:+pos.lng.toFixed(6),acc:pos.acc,dist:d,flags,verified:!flags.length,photo:null,photoHash,dupOf,
      answers:p.answers,comments:[],campaignId:p.campaignId||null,itemId:p.itemId||null};
    v.seal=sealCode(v);
    if(p.photo)v.photo=await stampPhoto(p.photo,v);
    return v}
};
// Firma de la visita: si alguien cambia hora, ubicación, alertas o respuestas, el sello deja de coincidir.
// En el servidor real se usa HMAC-SHA256 con una clave secreta.
function sealCode(v){
  const s=[v.id,v.serverTs||v.ts,v.asesorId,v.clientId||v.itemId||v.branchId||'',v.lat,v.lng,v.acc,v.dist,(v.flags||[]).join(','),v.verified?1:0,v.photoHash||'',JSON.stringify(v.answers||{}),SECRET].join('|');
  let h1=2166136261,h2=5381;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,16777619);h2=Math.imul(h2,33)^ch}
  return ((h1>>>0).toString(36)+(h2>>>0).toString(36)).toUpperCase().slice(0,10)}
const sealOk=v=>!!v.seal&&sealCode(v)===v.seal;
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
// Huella de la foto (dHash de 64 bits): fotos iguales o casi iguales dan huellas casi iguales,
// aunque estén recortadas, comprimidas o con otro brillo.
async function dHash(src){
  const img=await loadImg(src),c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(img,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data,g=i=>d[i]*.299+d[i+1]*.587+d[i+2]*.114;let bits='';
  for(let y=0;y<8;y++)for(let i=0;i<8;i++){const a=(y*9+i)*4;bits+=g(a)>g(a+4)?'1':'0'}
  let hex='';for(let i=0;i<64;i+=4)hex+=parseInt(bits.slice(i,i+4),2).toString(16);return hex}
function hamming(a,b){let n=0;for(let i=0;i<a.length;i++){let x=parseInt(a[i],16)^parseInt(b[i],16);while(x){n+=x&1;x>>=1}}return n}
async function stampPhoto(src,v){
  const img=await loadImg(src),fs=Math.max(12,Math.round(img.width/40)),band=Math.round(fs*4.9),pad=Math.round(fs*.7);
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height+band;const x=c.getContext('2d');x.drawImage(img,0,0);
  x.fillStyle='#0b1514';x.fillRect(0,img.height,c.width,band);x.textBaseline='top';const w=c.width-pad*2;let y=img.height+Math.round(pad*.6);
  x.fillStyle='#ffffff';x.font=`700 ${fs}px system-ui,sans-serif`;x.fillText(`${v.target.name} · ${U(v.asesorId).name}`,pad,y,w);y+=Math.round(fs*1.4);
  x.fillStyle='#cfe3df';x.font=`${fs}px system-ui,sans-serif`;x.fillText(`${new Date(v.serverTs).toLocaleString('es-PY')} · hora del servidor`,pad,y,w);y+=Math.round(fs*1.4);
  x.fillText(`${v.lat.toFixed(5)}, ${v.lng.toFixed(5)} · ±${v.acc} m · a ${fmtM(v.dist)} del comercio · Sello ${v.seal}`,pad,y,w);
  return c.toDataURL('image/jpeg',.62)}
function serverHTML(v){
  const sk=v.skewMin||0,dup=v.dupOf?S.visits.find(x=>x.id===v.dupOf):null;
  return `<div class="lbl">Validación del servidor</div><dl class="kv">
  <dt>Hora del servidor</dt><dd>${fmtDT(v.serverTs||v.ts)}</dd>
  <dt>Hora del celular</dt><dd class="${Math.abs(sk)>S.settings.maxSkew?'tbad':''}">${fmtDT(v.deviceTs||v.ts)} ${sk?`(${sk>0?'+':''}${sk} min)`:'(coincide)'}</dd>
  <dt>Sello de la visita</dt><dd>${v.seal?`<span class="mono">${v.seal}</span> ${sealOk(v)?'<span class="badge ok">✓ válido</span>':'<span class="badge bad">✕ los datos fueron modificados</span>'}`:'—'}</dd>
  <dt>Huella de la foto</dt><dd class="mono">${v.photoHash||'—'}</dd>
  ${dup?`<dt>Foto repetida</dt><dd><button class="btn sm" data-act="detail" data-id="${dup.id}">Igual a la de ${esc(dup.target.name)} · ${fmtD(dup.ts)}</button></dd>`:''}</dl>`}
function migrate(){
  S.settings={maxSkew:5,clockOffset:0,dupDist:6,mobileOnly:true,...S.settings};
  const u1=S.users.find(u=>u.id==='u1');if(u1&&u1.name==='María González')u1.name='G. Bazán';
  const g1=S.users.find(u=>u.id==='g1');if(g1&&g1.name==='Ana Villalba')g1.name='Administrador';

  S.visits.forEach(v=>{if(!v.serverTs)v.serverTs=v.ts;if(!v.deviceTs)v.deviceTs=v.ts;if(v.skewMin==null)v.skewMin=0;if(!v.seal)v.seal=sealCode(v)});

      S.locRequests.push({id:uid(),clientId:c.id,asesorId:a,ts:Date.now()-2*3600e3,from:{lat:c.lat,lng:c.lng},to:{...home,acc:14},reason:'El comercio se mudó',note:'Se pasó a la otra cuadra',status:'pendiente',sim:false});

      if(c2)S.locRequests.push({id:uid(),clientId:c2.id,asesorId:a,ts:Date.now()-40*60e3,from:{lat:c2.lat,lng:c2.lng},to:{lat:+(home.lat+0.0002).toFixed(6),lng:+(home.lng-0.0001).toFixed(6),acc:11},reason:'La ubicación está cargada mal',note:'',status:'pendiente',sim:false})}}
}

/* ============ 3. Fotos en Supabase ============
   Cada foto sellada se sube a un bucket privado de Supabase Storage:
     AAAA-MM-DD/<asesor>-<id>/HHMM_<comercio>_<idVisita>.jpg  (+ .json con los datos de la visita)
   Las reglas del bucket permiten subir y leer, pero no reemplazar ni borrar. */
let SB=null,SBK='';
function sbClient(){const R=S.settings;if(!R.sbUrl||!R.sbKey||!window.supabase?.createClient)return null;const k=R.sbUrl+'|'+R.sbKey;
  if(!SB||SBK!==k){try{SB=window.supabase.createClient(R.sbUrl,R.sbKey,{auth:{persistSession:false}});SBK=k}catch(e){return null}}return SB}
const bucket=()=>(S.settings.sbBucket||'visitas').trim();
function isSecretKey(k){if(/^sb_secret_/i.test(k))return true;try{return /service_role/.test(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return false}}
function sbSQL(){const b=bucket().replace(/'/g,"''");return `-- 1. Bucket privado para las fotos
insert into storage.buckets (id, name, public)
values ('${b}', '${b}', false)
on conflict (id) do nothing;

-- 2. Se puede SUBIR fotos (no reemplazar)
create policy "${b}_subir" on storage.objects
for insert to anon, authenticated
with check (bucket_id = '${b}');

-- 3. Se puede VER y DESCARGAR fotos
create policy "${b}_ver" on storage.objects
for select to anon, authenticated
using (bucket_id = '${b}');

-- No hay reglas de UPDATE ni DELETE:
-- nadie puede reemplazar ni borrar fotos desde la app.`}
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
const pad2=n=>String(n).padStart(2,'0');
const isoDay=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
function visitPath(v){const d=new Date(v.serverTs||v.ts);return `${isoDay(d)}/${slug(U(v.asesorId).name)}-${v.asesorId}/${pad2(d.getHours())}${pad2(d.getMinutes())}_${slug(v.target.name)}_${v.id}.jpg`}
function visitMeta(v){return{id:v.id,comercio:v.target.name,cliente_id:v.clientId,sucursal_id:v.branchId||null,asesor:U(v.asesorId).name,asesor_id:v.asesorId,
  hora_servidor:new Date(v.serverTs||v.ts).toISOString(),hora_celular:new Date(v.deviceTs||v.ts).toISOString(),diferencia_hora_min:v.skewMin||0,
  latitud:v.lat,longitud:v.lng,precision_m:v.acc,distancia_al_comercio_m:v.dist,ubicacion_comercio:{latitud:v.target.lat,longitud:v.target.lng},
  verificada:v.verified,alertas:v.flags.map(f=>FLAGS[f]),sello:v.seal,huella_foto:v.photoHash,foto_repetida_de:v.dupOf,
  respuestas:Object.fromEntries(S.form.map(f=>[f.label,v.answers?.[f.id]??''])),campania_id:v.campaignId}}
const alreadyThere=e=>!!e&&/exist|duplicate|409/i.test(String(e.message||'')+String(e.statusCode||''));
async function uploadVisit(v){
  const c=sbClient();if(!c)throw new Error('Supabase no está configurado');if(!v.photo||v.photo==='demo')return;
  const path=visitPath(v),b=bucket(),blob=await (await fetch(v.photo)).blob();
  let r=await c.storage.from(b).upload(path,blob,{contentType:'image/jpeg',upsert:false});if(r.error&&!alreadyThere(r.error))throw r.error;
  r=await c.storage.from(b).upload(path.replace(/\.jpg$/,'.json'),new Blob([JSON.stringify(visitMeta(v),null,2)],{type:'application/json'}),{contentType:'application/json',upsert:false});
  if(r.error&&!alreadyThere(r.error))throw r.error;
  v.photoPath=path;v.photoPending=false;v.photo=await makeThumb(v.photo,360)} // en el celular queda solo una miniatura
async function makeThumb(src,max){const img=await loadImg(src),k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
let syncing=false;
async function syncPending(loud){

async function fxSearch(){
  const c=sbClient();if(!c)return;const from=$('#fx-from').value,to=$('#fx-to').value;
  if(!from||!to||from>to)return toast('Revisá las fechas');const days=dayRange(from,to);if(days.length>62)return toast('Elegí un período de hasta 2 meses');
  Object.assign(FX,{from,to,loading:true,error:null,items:[],searched:true});fxPaint();const b=bucket();
  try{
    for(const day of days){const r=await c.storage.from(b).list(day,{limit:1000});if(r.error)throw r.error;
      for(const f of (r.data||[]).filter(x=>x.id===null)){if(FX.asesor!=='all'&&!f.name.endsWith('-'+FX.asesor))continue;
        const r2=await c.storage.from(b).list(`${day}/${f.name}`,{limit:1000,sortBy:{column:'name',order:'asc'}});if(r2.error)throw r2.error;
        (r2.data||[]).filter(x=>x.name.endsWith('.jpg')).forEach(x=>FX.items.push(parseItem(day,f.name,x)))}}
    for(let i=0;i<FX.items.length;i+=100){const ch=FX.items.slice(i,i+100),r=await c.storage.from(b).createSignedUrls(ch.map(x=>x.path),3600);
      if(!r.error)(r.data||[]).forEach((d,j)=>{if(ch[j]&&d.signedUrl)ch[j].url=d.signedUrl})}
  }catch(e){FX.error=e.message||String(e)}
  FX.loading=false;fxPaint()}
async function fxZip(){
  if(!window.JSZip)return toast('No se pudo cargar el compresor ZIP (revisá la conexión)');if(!FX.items.length)return;
  const zip=new JSZip(),rows=[],z=$('#fx-zip');let n=0;
  for(let i=0;i<FX.items.length;i++){const x=FX.items[i];if(z)z.textContent=`Descargando ${i+1} de ${FX.items.length}…`;
    try{zip.file(x.path,await sbDownload(x.path));n++}catch(e){continue}
    try{const t=await (await sbDownload(x.path.replace(/\.jpg$/,'.json'))).text(),m=JSON.parse(t);zip.file(x.path.replace(/\.jpg$/,'.json'),t);
      rows.push({Fecha:x.day,Hora:x.hora,Asesor:m.asesor,Comercio:m.comercio,'Verificada':m.verificada?'Sí':'No',Alertas:(m.alertas||[]).join('; '),
        'Distancia al comercio (m)':m.distancia_al_comercio_m,'Precisión GPS (m)':m.precision_m,Latitud:m.latitud,Longitud:m.longitud,
        'Hora servidor':m.hora_servidor,'Hora celular':m.hora_celular,Sello:m.sello,Archivo:x.path})}
    catch(e){rows.push({Fecha:x.day,Hora:x.hora,Asesor:x.asesor,Comercio:x.comercio,Archivo:x.path})}}
  if(rows.length){const h=[...new Set(rows.flatMap(r=>Object.keys(r)))];
    zip.file('indice.csv','﻿'+[h.join(';')].concat(rows.map(r=>h.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))).join('\r\n'))}
  if(z)z.textContent='Comprimiendo…';const blob=await zip.generateAsync({type:'blob'});
  saveBlob(blob,`fotos-visitas_${FX.from}_al_${FX.to}.zip`);if(z)z.textContent='⬇ Descargar todo (ZIP)';toast(`ZIP listo con ${n} fotos`)}

async function importBranches(file){
  try{const rows=await readSheet(file),out=[];let skip=0;
    rows.forEach(r=>{const suc=String(pick(r,['sucursal','sucursales'])).trim(),fran=String(pick(r,['franquicia'])).trim();
      let lat=num(pick(r,['latitud','lat'])),lng=num(pick(r,['longitud','lng','lon']));const co=String(pick(r,['coordenadas','coordenada','ubicacion'])).replace(/\s/g,'');
      if((isNaN(lat)||isNaN(lng))&&co){const m=co.split(/[,;]/);lat=parseFloat(m[0]);lng=parseFloat(m[1])}
      if(!suc||isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180){skip++;return}
      const prev=S.branches.find(b=>norm(b.fran)===norm(fran)&&norm(b.suc)===norm(suc));
      out.push({id:prev?prev.id:'b'+uid(),marca:String(pick(r,['marca'])).trim(),depto:normDepto(String(pick(r,['departamento','depto'])).trim()),fran,suc,
        dir:String(pick(r,['direccion','domicilio'])).replace(/\s+/g,' ').trim(),lat:+lat.toFixed(6),lng:+lng.toFixed(6)})});
    if(!out.length)return toast('No se encontraron sucursales con coordenadas en el archivo');
    if(!confirm(`Se van a reemplazar las ${S.branches.length} sucursales actuales por las ${out.length} del archivo. Las visitas ya registradas se mantienen. ¿Continuar?`))return;
    S.branches=out;save();render();toast(`${out.length} sucursales cargadas${skip?` · ${skip} filas sin sucursal o coordenadas`:''}`)}catch(e){toast(e.message||String(e))}}
function exportBranches(){
  if(!window.XLSX)return toast('Para exportar a Excel hace falta conexión a internet.');const bl=branchLast();
  const rows=branchesF().map((b,i)=>({Orden:i+1,MARCA:b.marca,DEPARTAMENTO:b.depto,FRANQUICIA:b.fran,SUCURSAL:b.suc,'DIRECCIÓN':b.dir,COORDENADAS:`${b.lat},${b.lng}`,
    'Última visita':bl[b.id]?fmtDT(bl[b.id].ts):'','Visitada por':bl[b.id]?U(bl[b.id].asesorId).name:''}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Sucursales');XLSX.writeFile(wb,'sucursales-aliados.xlsx')}

/* ============ Excel ============ */
const pick=(r,keys)=>{for(const k of Object.keys(r))if(keys.includes(norm(k)))return r[k];return ''};
const num=x=>parseFloat(String(x).replace(',','.'));
async function readSheet(file){if(!window.XLSX)throw new Error('Para leer Excel hace falta conexión a internet.');const wb=XLSX.read(await file.arrayBuffer());return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
async function importClients(file){
  try{const rows=await readSheet(file);let ok=0,skip=0;
    rows.forEach(r=>{const name=String(pick(r,['nombre','cliente','comercio'])).trim(),lat=num(pick(r,['latitud','lat'])),lng=num(pick(r,['longitud','lng','lon','long']));
      if(!name||isNaN(lat)||isNaN(lng)){skip++;return}let tier=String(pick(r,['importancia','categoria','tier'])).trim().toUpperCase();if(!['A','B','C'].includes(tier))tier='C';
      const an=norm(pick(r,['asesor','vendedor']));const a=an?asesores().find(x=>norm(x.name).includes(an)):null;
      S.clients.push({id:uid(),name,address:String(pick(r,['direccion','domicilio'])),lat,lng,tier,type:norm(pick(r,['tipo']))==='prospecto'?'prospecto':'cliente',asesorId:a?a.id:nearestAsesor(lat,lng),locHistory:[]});ok++});
    save();render();toast(`Se importaron ${ok} clientes${skip?` · ${skip} filas sin nombre o coordenadas`:''}`)}catch(e){toast(e.message)}}
function downloadTemplate(){
  if(!window.XLSX)return toast('Para generar Excel hace falta conexión a internet.');
  const ws=XLSX.utils.json_to_sheet([{Nombre:'Despensa Ejemplo',Dirección:'Av. España 1234',Latitud:-25.2867,Longitud:-57.6170,Importancia:'A',Asesor:'María González',Tipo:'cliente'},{Nombre:'Kiosco Ejemplo',Dirección:'Mcal. López 456',Latitud:-25.2950,Longitud:-57.5900,Importancia:'C',Asesor:'',Tipo:'prospecto'}]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Clientes');XLSX.writeFile(wb,'plantilla-clientes.xlsx')}
function exportVisits(){
  const u=me(),aid=u.role==='asesor'?u.id:ui.asesor,vs=visitsF(pStart(ui.period),aid);
  const rows=vs.map(v=>{const r={Fecha:fmtD(v.ts),Hora:fmtT(v.ts),Asesor:U(v.asesorId).name,Comercio:v.target.name,'Latitud visita':v.lat,'Longitud visita':v.lng,'Precisión GPS (m)':v.acc,'Distancia al comercio (m)':v.dist,'Verificada por GPS':v.verified?'Sí':'No','Alertas':v.flags.map(f=>FLAGS[f]).join('; ')};
    S.form.forEach(f=>r[f.label]=v.answers?.[f.id]??'');
    r['Hora servidor']=fmtDT(v.serverTs||v.ts);r['Hora celular']=fmtDT(v.deviceTs||v.ts);r['Diferencia de hora (min)']=v.skewMin||0;r.Sello=v.seal||'';r['Sello válido']=v.seal&&sealCode(v)===v.seal?'Sí':'No';
    r['Foto repetida de']=v.dupOf?(S.visits.find(x=>x.id===v.dupOf)?.target.name||v.dupOf):'';r['Foto en Supabase']=v.photoPath||(v.photoPending?'pendiente de subir':'');r.Comentarios=v.comments.map(c=>U(c.by).name+': '+c.text).join(' | ');r['Ver en mapa']=`https://www.google.com/maps?q=${v.lat},${v.lng}`;return r});
  if(!rows.length)return toast('No hay visitas para exportar');
  if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Visitas');XLSX.writeFile(wb,`visitas-${ui.period}.xlsx`)}
  else{const h=Object.keys(rows[0]);const csv=[h.join(';')].concat(rows.map(r=>h.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"').join(';'))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='visitas.csv';a.click()}}

  casesor:(v,el)=>{S.clients.find(c=>c.id===el.dataset.id).asesorId=v;save();refreshClients()},

  fkpi:v=>{S.form.forEach(f=>f.kpi=f.id===v);save()},
